<!doctype html>
<html lang="en">
<head><script data-cfasync="false">if(self!==top)document.write('<style id="framed">nav:first-of-type,.hero-head,.hero-head *{visibility:hidden!important}</style>')</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>50agents: the four videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* All four videos in one hero, for review: one stage plays a video to its end, then the next. The switcher under it names
   what is built (an app, an automation, an AI agent, a browser agent) with the crew member who runs it. Each video is its own
   page (stage-film-*.html) loaded bare, so they stay separate while they are being approved. */
:root{--ink:#141518;--mute:#5E6068;--faint:#6A6D76;--line:#E3E4E8;--disp:'Bricolage Grotesque',system-ui,sans-serif;--ui:'Schibsted Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
p{margin:0}
.top{position:sticky;top:0;z-index:20;pointer-events:none}
.top>nav>*{pointer-events:auto}
nav{display:flex;align-items:center;gap:32px;max-width:1304px;margin:0 auto;padding:16px 32px;transition:max-width .45s ease,padding .45s ease}
.top.sc nav{max-width:100%;padding:14px 20px}
.wm{font-size:30px;display:flex;align-items:center;border-radius:14px;transition:background .3s,box-shadow .3s,padding .3s,margin .3s}
.top.sc .wm{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(20,21,24,.08);padding:6px 12px;margin:-6px -12px}
nav .jb{margin-left:auto;background:var(--ink);color:#fff;font:600 14.5px var(--ui);padding:10px 16px;border-radius:9px;text-decoration:none}
.hero{max-width:1304px;margin:0 auto;padding:36px 32px 0;display:grid;grid-template-columns:1fr 520px;gap:40px;align-items:end;font-family:var(--disp)}
h1{font-weight:600;font-size:clamp(46px,6.2vw,88px);line-height:.96;letter-spacing:-.045em;margin:0;font-variation-settings:'opsz' 96}
.aside{padding-bottom:8px}
.sub{font-size:19px;line-height:1.45;color:var(--mute);margin-bottom:20px}
.sub b{color:var(--ink);font-weight:600;white-space:nowrap}
.cta{display:inline-block;background:var(--ink);color:#fff;font-weight:600;font-size:15.5px;padding:14px 24px;border-radius:10px;text-decoration:none}
.stagebox{max-width:1304px;margin:36px auto 64px;padding:0 32px}
.frame{position:relative;height:540px;border-radius:28px;overflow:hidden;background:#EEF0F4}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .35s}
.frame iframe.off{opacity:0}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.pick button{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);overflow:hidden;transition:border-color .3s,background .3s}
.pick button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick button b{display:block;font-weight:600;font-size:15px}
.pick button small{display:block;color:var(--faint);font-size:13px}
.pick button.on{border-color:var(--ink)}
@media (max-height:820px) and (min-width:861px){.hero{padding-top:18px}h1{font-size:clamp(46px,5.2vw,70px)}.stagebox{margin-top:32px}.frame{height:500px}}
@media (max-width:860px){
  nav{padding:12px 20px}.wm{font-size:26px}nav .jb{padding:9px 13px;font-size:14px}
  .hero{grid-template-columns:1fr;gap:18px;padding:28px 20px 0}
  h1{font-size:clamp(44px,12.4vw,64px)}.sub{font-size:17px;margin-bottom:18px}
  .stagebox{padding:0 12px;margin-top:30px}
  .frame{height:500px;border-radius:22px}
  .pick{grid-template-columns:1fr 1fr;gap:8px}.pick button{padding:9px 11px}.pick button small{font-size:12px}
}
</style>
</head>
<body>
<header class="top hero-head"><nav><span class="wm" id="wm">50agents</span><a class="jb" href="#join">Join early access</a></nav></header>
<section class="hero">
  <h1>Your own apps,<br>doing the work.</h1>
  <div class="aside">
    <p class="sub">Build apps, AI agents and automations on your tools or from scratch. They do the work across <b>2,300+ apps</b>.</p>
    <a class="cta" href="#join">Join early access</a>
  </div>
</section>
<section class="stagebox" aria-label="Four short videos: an app, an automation, an AI agent and a browser agent, each built on 50agents and working">
  <div class="frame" id="frame"></div>
  <div class="pick" id="pick" role="tablist"></div>
</section>
<script data-cfasync="false" src="crew.js?v=7"></script>
<script data-cfasync="false">
wordmark(document.getElementById('wm'));
// [file, what it is, what it does, crew member]
const F=[['app','An app','Order desk','writer',0],['auto','An automation','Delivery runs','sunny',0],['agent','An AI agent','Win back cafés','closer',0],['browser','A browser agent','Supplier prices','scout',0]];
const frame=document.getElementById('frame'),pick=document.getElementById('pick');
pick.innerHTML=F.map(([f,t,d,c,s],i)=>`<button role="tab" data-i="${i}">${face(c,26)}<span><b>${t}</b><small>${d}</small></span></button>`).join('');
let cur=-1,ifr=null;
function play(i){
  if(i===cur)return;cur=i;
  pick.querySelectorAll('button').forEach((b,j)=>{b.classList.remove('on');b.setAttribute('aria-selected',j===i);if(j===i){void b.offsetWidth;b.classList.add('on');}});
  const old=ifr;ifr=document.createElement('iframe');ifr.title=F[i][1]+': '+F[i][2];ifr.className='off';ifr.src=`stage-film-${F[i][0]}.html?bare`;
  ifr.onload=()=>{ifr.classList.remove('off');if(old)setTimeout(()=>old.remove(),400);};frame.appendChild(ifr);
}
pick.addEventListener('click',e=>{const b=e.target.closest('button');if(b)play(+b.dataset.i);});
addEventListener('message',e=>{if(ifr&&e.source===ifr.contentWindow&&e.data&&e.data.film==='done')play((cur+1)%F.length);});
const topBar=document.querySelector('.top');addEventListener('scroll',()=>topBar.classList.toggle('sc',scrollY>8),{passive:true});
play(0);
</script>
</body>
</html>
